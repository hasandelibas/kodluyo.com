  <div id="editor-langbar">
    <a data-lang="python" href="#">Python</a>
    <a data-lang="javascript" href="#">JavaScript</a>
    <div class="space"></div>
    <a class="home" href="../">&larr; kodluyo.com</a>
  </div>

  <script>
  </script>

  <pre id="editor-error"></pre>

  <script>
    // Online editör: secilen dile gore editor.md dosyasini yukleyip
    // ders sayfasiyla ayni gorunumu (Views.Create) kurar.
    (function () {
      var params = new URLSearchParams(location.search);
      var lang = String(params.get("lang") || "python").toLowerCase();
      if (lang == "js" || lang == "node" || lang == "nodejs") lang = "javascript";
      if (lang != "javascript") lang = "python";
      var label = lang == "javascript" ? "javascript" : "python";

      document.title = "kodluyo.com ~ " + label + " editörü";

      var buttons = document.querySelectorAll("#editor-langbar [data-lang]");
      for (var i = 0; i < buttons.length; i++) {
        var button = buttons[i];
        button.href = location.pathname + "?lang=" + button.getAttribute("data-lang");
        if (button.getAttribute("data-lang") == lang) button.classList.add("active");
      }

      fetch("./editor/" + lang + ".md")
        .then(function (response) {
          if (!response.ok) throw new Error("editör kaynağı bulunamadı (" + response.status + ")");
          return response.text();
        })
        .then(function (text) {
          var data = Dion.parse(text);
          LevelFixer.fix(data);
          return Asenac("./views/editor.js", "./views/levels.js").then(function () {
            var panel = Views.Create(data);
            if (panel.elements.panelTitle) {
              panel.elements.panelTitle.textContent = "kodluyo.com ~ " + label;
            }
            if (panel.elements.upButton) panel.elements.upButton.remove();
            document.body.appendChild(panel.elements.parent);
          });
        })
        .catch(function (error) {
          document.getElementById("editor-error").textContent = "Editör yüklenemedi: " + error.message;
        });
    })();
  </script>
